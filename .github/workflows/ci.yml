
name: FinSight AI CI

on:
  push:
  pull_request:

jobs:
  security-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run security tests
        env:
          FINSIGHT_API_KEY: ci-test-key
          FINSIGHT_DEMO_USER_ID: demo
        run: python -m pytest tests/test_agent_security.py tests/test_api_security.py tests/test_request_middleware.py -v
       